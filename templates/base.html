<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}KLL FindIt AI{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a class="brand" href="{{ url_for('index') }}">KLL FindIt AI</a>
    <nav>
      <a href="{{ url_for('report_lost') }}">I lost something</a>
      <a href="{{ url_for('log_found') }}">I found something</a>
    </nav>
  </header>
  <main>
    {% with messages = get_flashed_messages() %}
      {% for m in messages %}<p class="flash">{{ m }}</p>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
